services:
  - type: web
    name: online-pharmacy-diplom
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: online-pharmacy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: online-pharmacy-db
    plan: free
    region: singapore
    databaseName: online_pharmacy
    user: online_pharmacy_user
